<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Home lab a tre nodi: server i7-9700K, Raspberry Pi 5, MacBook, uniti da rete mesh cifrata" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="hb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0c1319"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" rx="10" fill="url(#hb)"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="10" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="42" font-size="12" letter-spacing="3" fill="#7d8590">HOME LAB</text>
    <text x="40" y="66" font-size="15" fill="#8b949e">Tre nodi su rete mesh cifrata, in esercizio continuo</text>

    <!-- nodo 1 -->
    <rect x="40" y="90" width="292" height="172" rx="7" fill="#161b22" stroke="#30363d"/>
    <circle cx="62" cy="118" r="5" fill="#0d1117" stroke="#39a0ed" stroke-width="2"/>
    <text x="80" y="122" font-size="14" font-weight="600" fill="#e6edf3">server</text>
    <text x="80" y="141" font-size="11" fill="#6e7781">Intel i7-9700K &#183; Linux</text>
    <line x1="62" y1="156" x2="310" y2="156" stroke="#30363d"/>
    <g font-size="11.5" fill="#8b949e">
      <text x="62" y="177">docker &#183; servizi containerizzati</text>
      <text x="62" y="197">ollama &#183; modelli in locale</text>
      <text x="62" y="217">anton-ocr &#183; pipeline privacy</text>
      <text x="62" y="237">fail2ban &#183; lsyncd &#183; backup</text>
    </g>

    <!-- nodo 2 -->
    <rect x="354" y="90" width="292" height="172" rx="7" fill="#161b22" stroke="#30363d"/>
    <circle cx="376" cy="118" r="5" fill="#0d1117" stroke="#39a0ed" stroke-width="2"/>
    <text x="394" y="122" font-size="14" font-weight="600" fill="#e6edf3">raspberry pi 5</text>
    <text x="394" y="141" font-size="11" fill="#6e7781">NVMe SSD &#183; gateway</text>
    <line x1="376" y1="156" x2="624" y2="156" stroke="#30363d"/>
    <g font-size="11.5" fill="#8b949e">
      <text x="376" y="177">tailscale &#183; uscita della rete</text>
      <text x="376" y="197">adguard home &#183; DNS filtrato</text>
      <text x="376" y="217">sentinel &#183; auto-diagnostica</text>
      <text x="376" y="237">gateway sempre acceso</text>
    </g>

    <!-- nodo 3 -->
    <rect x="668" y="90" width="292" height="172" rx="7" fill="#161b22" stroke="#30363d"/>
    <circle cx="690" cy="118" r="5" fill="#0d1117" stroke="#39a0ed" stroke-width="2"/>
    <text x="708" y="122" font-size="14" font-weight="600" fill="#e6edf3">macbook</text>
    <text x="708" y="141" font-size="11" fill="#6e7781">sviluppo &#183; client</text>
    <line x1="690" y1="156" x2="938" y2="156" stroke="#30363d"/>
    <g font-size="11.5" fill="#8b949e">
      <text x="690" y="177">daemon OCR &#183; watcher</text>
      <text x="690" y="197">dashboard accademica</text>
      <text x="690" y="217">NAS Samba montato</text>
      <text x="690" y="237">knowledge graph &#183; 189 nodi</text>
    </g>

    <!-- collegamenti mesh -->
    <g stroke="#39a0ed" stroke-width="1.4" fill="none">
      <line x1="332" y1="176" x2="354" y2="176" stroke-opacity="0.5">
        <animate attributeName="stroke-opacity" values="0.2;0.75;0.2" dur="3.4s" repeatCount="indefinite"/>
      </line>
      <line x1="646" y1="176" x2="668" y2="176" stroke-opacity="0.5">
        <animate attributeName="stroke-opacity" values="0.75;0.2;0.75" dur="3.4s" repeatCount="indefinite"/>
      </line>
    </g>

    <text x="40" y="287" font-size="10.5" letter-spacing="1.4" fill="#525c66">TAILSCALE &#183; STORAGE CONDIVISO &#183; BACKUP VERIFICATI &#183; UTENZA REALE</text>
  </g>
</svg>
